[project]
name = "dj-inbox-assistant"
version = "0.1.0"
description = "Ask-your-inbox assistant for DJ and event companies"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "anthropic>=2.5", "google-genai>=2.34", "google-adk>=2.13", "fastapi>=0.162", "uvicorn>=0.54", "psycopg[binary,pool]>=3.3", "pgvector>=0.5", "numpy>=2.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "synthetic_inbox/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/F: real errors (syntax, undefined or unused names)   I: import order
# B: likely bugs (mutable defaults, etc.)                UP: modern Python syntax
select = ["E", "F", "I", "B", "UP"]
