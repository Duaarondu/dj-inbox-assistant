[project]
name = "dj-inbox-assistant"
version = "0.1.0"
description = "Ask-your-inbox assistant for DJ and event companies"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "synthetic_inbox/tests"]
